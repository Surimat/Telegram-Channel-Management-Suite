# Alembic configuration for Telegram Channel Management Suite.
#
# The database URL is NOT stored here: `migrations/env.py` resolves it at
# runtime from the application settings (so `.env`, `TCMS_ROOT` and portable
# mode all keep working). This file only defines script locations and logging.
#
# Run migrations via the guarded application runner:
#   python -m backend.app.db.migrate upgrade
# This wrapper takes a pre-migration backup and reports beginner-friendly state.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped revision filenames keep the history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# ``sqlalchemy.url`` is intentionally left empty; env.py fills it in.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
