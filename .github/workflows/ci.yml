name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Tests (pytest)
        run: pytest

  meta-audit:
    name: Meta-audit (auditor kill-rate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # Proves the Consistency Auditor detects deliberately seeded drift by
      # *executing* every mutation (D-102). The engine writes a generated
      # agent/META_AUDIT_RESULT.json and fails the job if any mutation errored, a
      # negative control false-fired, or a previously-detected mutation is now
      # missed (a silently removed detector). No percentage is hardcoded here.
      - name: Auditor meta-audit (runtime mutation engine)
        run: PYTHONPATH=. python tests/meta_audit/engine.py

      - name: Mutation + runtime tests
        run: pytest tests/test_consistency_mutations.py tests/test_meta_audit.py -q

      # A synthetic defect must never leak into production source. Mutations only
      # ever write into a temp copy, but guard the real tree explicitly by looking
      # for the synthetic markers the mutations use (new untracked files are the
      # most likely leak; committed edits are not).
      - name: Assert no synthetic defects in the working tree
        run: |
          leaks=$(git status --porcelain -- backend/app frontend/src migrations/versions \
            | grep -E 'zz_|ghost|Ghost' || true)
          if [ -n "$leaks" ]; then
            echo "::error::synthetic mutation leaked into the working tree"
            echo "$leaks"
            exit 1
          fi

      - name: Upload kill-rate result
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-result
          path: agent/META_AUDIT_RESULT.json
          if-no-files-found: error

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  browser-tests:
    # Separately installed real Chromium so the Web Wrapper Hub's genuine
    # browser runtime is exercised end to end, instead of being skipped for a
    # missing browser. The scenarios use a *local* fixture site only — no
    # third-party site, account or key (v2.0 integration verification).
    name: Browser (real Playwright/Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Playwright + Chromium
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium

      # A skip means the browser layer silently did not run; that must fail the
      # job, not pass quietly. The tests drive only the local FixtureSite.
      - name: Run real Playwright integration tests (must not skip)
        run: |
          set -o pipefail
          pytest tests/test_web_wrapper_playwright_integration.py -q 2>&1 | tee /tmp/pw.log
          if grep -Eq '[0-9]+ skipped' /tmp/pw.log; then
            echo "::error::Playwright integration tests were skipped — Chromium is not available"
            exit 1
          fi
