name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Tests (pytest)
        run: pytest

  meta-audit:
    name: Meta-audit (auditor kill-rate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # Proves the Consistency Auditor detects deliberately seeded drift, reports a
      # failed check instead of swallowing it, and never false-greens. Writes
      # agent/META_AUDIT_RESULT.json (uploaded below).
      - name: Auditor meta-audit
        run: pytest tests/test_consistency_mutations.py tests/test_meta_audit.py -q

      - name: Upload kill-rate result
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-result
          path: agent/META_AUDIT_RESULT.json
          if-no-files-found: error

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
