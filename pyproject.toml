[project]
name = "telegram-channel-management-suite"
version = "1.6.0"
description = "Local-first Telegram channel management suite."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "backend/app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
# B008: FastAPI intentionally uses function calls (Depends/Query) as defaults.
# RUF001/2/3: the UI is Russian-first; Cyrillic strings are intentional.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
"backend/app/scheduler/scheduler.py" = ["B023"]
# The help catalog is long-form Russian prose for beginners; wrapping it to 100
# columns would hurt readability of the source text, not the rendered output.
"backend/app/services/help_topics.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
