[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    slow: end-to-end startup tests that spawn a real server subprocess
filterwarnings =
    ignore::DeprecationWarning
    # aiosqlite emits ResourceWarning at connection GC time; the engine is
    # disposed in fixture teardown, so these are harmless driver noise.
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
